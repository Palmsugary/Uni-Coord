name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Refresh the timetable copy every 6 hours (only matters once ICAL_URL is set).
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js seed.json icons .nojekyll _site/
      - name: Copy timetable from calendar link
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          ICAL_FILE: ${{ secrets.ICAL_FILE }}
        run: |
          if [ -z "$ICAL_URL" ] || [ -z "$ICAL_FILE" ]; then
            echo "Timetable sync not set up (ICAL_URL / ICAL_FILE secrets missing); skipping."
            exit 0
          fi
          case "$ICAL_FILE" in *[!A-Za-z0-9_-]*) echo "ICAL_FILE may only contain letters, digits, - and _"; exit 1;; esac
          mkdir -p _site/cal
          # Outlook links sometimes start with webcal://; fetch them over https.
          url="${ICAL_URL/#webcal:\/\//https://}"
          if curl -fsSL --max-time 60 -A "Mozilla/5.0" "$url" -o cal.ics && grep -q "BEGIN:VCALENDAR" cal.ics; then
            mv cal.ics "_site/cal/$ICAL_FILE.ics"
            echo "Timetable copied."
          else
            echo "::warning::Couldn't download the calendar link; publishing without a fresh timetable."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
